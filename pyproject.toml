[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-adapter-ros2"
version = "0.1.0"
description = "ROS 2 / Nav2 Fleet Adapter — a Swarmada Fleet Adapter for ros2-nav2"
authors = [{ name = "The Swarmada Authors <maintainers@swarmada.io>" }]
license = { text = "Apache-2.0" }
# 3.10 — matches swarmada-sdk, and matches ROS 2 Humble. A reference adapter for the ROS 2
# CLASS that cannot be installed on the current ROS 2 LTS does not cover the class it claims.
requires-python = ">=3.10"
dependencies = [
  # The audited safety primitives (C3/C4/C5) — never re-implement them.
  # >=0.1.0 is the first version with FenceGuard.adopt, which the adapter calls on every
  # RegisterAck (C3.8); it refuses to import against an SDK without it.
  "swarmada-sdk>=0.1.0",
  # The oldest runtimes the Swarmada fleet_adapter.v1 stubs are tested against.
  "grpcio>=1.64.1",
  "protobuf>=3.20.3",
  "pyyaml>=6.0",  # simulated-binding scenario presets (--scenario)
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]
# The map view's desktop viewer (fleet_adapter_ros2/mapview/contract_view.py). The contract, the
# service, the browser viewer and the adapter's feed need nothing beyond the dependencies above.
desktop = ["matplotlib>=3.5"]

[project.scripts]
fleet-adapter-ros2 = "fleet_adapter_ros2.adapter:main"

[tool.setuptools.packages.find]
include = ["fleet_adapter_ros2*"]

[tool.setuptools.package-data]
"fleet_adapter_ros2.mapview" = ["CONTRACT.md", "README.md", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
