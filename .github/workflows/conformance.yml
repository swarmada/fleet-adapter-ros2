name: conformance
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # swarmada-sdk isn't on PyPI yet and the conformance harness lives in the
      # swarmada monorepo — sparse-checkout both from there. This adapter's proto
      # stubs are vendored here (fleet_adapter/), so it needs no monorepo access
      # at runtime; the checkouts are only for the SDK and the harness.
      #
      # Two checkouts, at two refs. The adapter needs an SDK that confirms a stop only from
      # a state report received after it (EstopToken, 5792bb5), which v0.4 predates; the
      # harness stays at the release it is qualified against. The SDK's only change since
      # rfc-0001-v0.4 is 5792bb5. It removes nothing, but it changes what existing callers
      # get: await_estop_confirmation now confirms only from a report counted after the stop
      # when the binding has state_seq, and warns once for a binding without one. Both
      # checkouts move to v0.4.1 once it is tagged.
      - name: Checkout swarmada SDK (5792bb5, EstopToken)
        uses: actions/checkout@v4
        with:
          repository: swarmada/swarmada
          ref: 5792bb578f2bd3f80f431a6e959ec8034dea7518
          path: swarmada-sdk
          sparse-checkout: |
            sdk/python
          sparse-checkout-cone-mode: false
      - name: Checkout swarmada monorepo (conformance harness + proto)
        uses: actions/checkout@v4
        with:
          repository: swarmada/swarmada
          # The release this adapter is qualified against. Without a ref the checkout takes
          # swarmada's main, and this workflow's result changes whenever the harness moves.
          ref: rfc-0001-v0.4
          path: swarmada-src
          sparse-checkout: |
            proto
            adapters/__init__.py
            adapters/conformance
            adapters/scenarios
          sparse-checkout-cone-mode: false
      - name: Install
        run: |
          pip install -e ./swarmada-sdk/sdk/python
          pip install -e '.[dev]' grpcio-tools
      - name: Safety-wiring tests
        run: pytest tests/ -v
      - name: Conformance (RFC-0001 v0.4, suite 2026.10.22.2)
        working-directory: swarmada-src
        run: |
          python -m adapters.conformance \
            --stub-path proto \
            --adapter-name fleet-adapter-ros2 \
            --adapter-cmd 'python3 ${{ github.workspace }}/fleet_adapter_ros2/adapter.py --endpoint localhost:{port} --binding simulated'
